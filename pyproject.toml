[project]
name = "pithtrain"
version = "0.1.3"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13.0,<2.14",
    "deep-gemm",
    "flash-attn-4[cu13]==4.0.0b28",
    "flash-linear-attention==0.5.2",
    "transformers",
    "wandb",
    "zstandard",
]

[dependency-groups]
dev = ["pre-commit", "pytest", "ruff"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[tool.setuptools.packages.find]
include = ["pithtrain*"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
deep-gemm = { git = "https://github.com/deepseek-ai/DeepGEMM", rev = "559d79fb6994a58b8a15b4b93bf13ccc16edf247" }
torch = { index = "torch-cu130" }

[tool.uv.extra-build-dependencies]
deep-gemm = ["torch>=2.13.0,<2.14", "packaging", "setuptools", "wheel"]

[tool.uv.extra-build-variables]
deep-gemm = { DG_FORCE_BUILD = "1", DG_USE_LOCAL_VERSION = "0" }

[tool.mypy]
follow_imports = "skip"
ignore_errors = false
ignore_missing_imports = true
show_column_numbers = true
show_error_context = true

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true
extend-exclude = [".agents/skills/*/templates/"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = ["E501", "E731"]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["pithtrain"]

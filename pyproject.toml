[project]
name = "pithtrain"
version = "0.1.4"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.15.0,<2.16",
    "apache-tvm-ffi==0.1.16",
    "apache-tvm-tirx==0.1.0",
    "deep-gemm",
    "flash-attn-4[cu13]==4.0.0b28",
    "quack-kernels==0.6.5",
    "tirx-kernels==0.1.3",
    "transformers",
    "wandb",
    "zstandard",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[tool.setuptools.packages.find]
include = ["pithtrain*"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "torch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
deep-gemm = { git = "https://github.com/deepseek-ai/DeepGEMM", rev = "5081f8513af57e61696de4f4f04b0e707ffb503e" }
torch = { index = "torch-cu132" }

[tool.uv.extra-build-dependencies]
deep-gemm = ["torch>=2.15.0,<2.16", "packaging", "setuptools", "wheel"]

[tool.uv.extra-build-variables]
deep-gemm = { DG_FORCE_BUILD = "1", DG_USE_LOCAL_VERSION = "0" }

[tool.pytest.ini_options]
# Tiers of the kernel tests (tests/kernels, cases generated by tests/kernels/cases.py at collection):
# smoke runs by default, the full spec and stress tiers and the multi-GPU tests only when selected
# (pytest -m spec, -m stress, -m multigpu). Unmarked tests are unaffected. See tests/kernels/README.md.
addopts = "-m 'not spec and not stress and not multigpu' --strict-markers"
markers = [
    "smoke: smallest spec cases, one or two per (family, model), and the spec's own checks; run by default",
    "spec: every training shape of tests/kernels/cases.py (pytest -m spec)",
    "stress: shapes past balanced training, e.g. all EP-group tokens on one expert (pytest -m stress)",
    "multigpu: needs cp GPUs (CP 16: two nodes), in no tier; a skip for missing GPUs fails the test (pytest -m multigpu)",
]

[tool.mypy]
follow_imports = "skip"
ignore_errors = false
ignore_missing_imports = true
show_column_numbers = true
show_error_context = true

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true
extend-exclude = [".agents/skills/*/templates/"]

[tool.ruff.format]
quote-style = "double"
exclude = ["pithtrain/kernels/**"]  # kernel code keeps calls, signatures and tables on one line

[tool.ruff.lint.per-file-ignores]
"pithtrain/kernels/**" = ["I001"]  # the import sorter would wrap kernel imports at 100 columns
"pithtrain/kernels/__init__.py" = ["F401"]  # names re-exported via __all__.append (tests/test_import_layers.py checks them)

[tool.ruff.lint]
ignore = ["E501", "E701", "E731"]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["pithtrain"]
